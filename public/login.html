<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ログイン - AA HUB</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 300px; }
        input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #1e90ff; color: white; border: none; border-radius: 6px; cursor: pointer; margin-bottom: 5px; }
        .sec { background: #2ed573; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>AA HUB</h2>
        <input id="userId" placeholder="ユーザーID">
        <input id="displayName" placeholder="表示名 (登録時のみ)">
        <input id="password" type="password" placeholder="パスワード">
        <button onclick="auth('login')">ログイン</button>
        <button onclick="auth('register')" class="sec">新規登録</button>
        <p style="text-align:center"><a href="/">戻る</a></p>
    </div>
    <script>
        async function auth(type) {
            const userId = document.getElementById('userId').value;
            const password = document.getElementById('password').value;
            const displayName = document.getElementById('displayName').value;
            const res = await fetch('/api/' + type, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ userId, password, displayName })
            });
            const data = await res.json();
            if (data.success) {
                localStorage.setItem('aa_user', JSON.stringify(data.user));
                window.location.href = '/';
            } else { alert(data.error); }
        }
    </script>
</body>
</html>
