<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ログイン - AA HUB 2026</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 350px; }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #1e90ff; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-bottom: 10px; }
        button.secondary { background: #2ed573; }
        .msg { font-size: 13px; color: #666; text-align: center; }
        a { color: #1e90ff; text-decoration: none; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2 id="title">AA HUB ログイン</h2>
        <input id="userId" placeholder="ユーザーID (@id)">
        <input id="displayName" placeholder="表示名 (登録時のみ)" id="name-field">
        <input id="password" type="password" placeholder="パスワード">
        
        <button onclick="submitAuth('login')" id="login-btn">ログイン</button>
        <button onclick="submitAuth('register')" class="secondary">新規登録</button>
        
        <p class="msg"><a href="/">掲示板に戻る</a></p>
    </div>

    <script>
        async function submitAuth(type) {
            const userId = document.getElementById('userId').value;
            const password = document.getElementById('password').value;
            const displayName = document.getElementById('displayName').value;

            const res = await fetch('/api/' + type, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ userId, password, displayName })
            });
            const data = await res.json();

            if (data.success) {
                localStorage.setItem('aa_user', JSON.stringify(data.user));
                alert(type === 'login' ? 'ログインしました！' : '登録が完了しました！');
                window.location.href = '/'; // トップへ戻る
            } else {
                alert(data.error);
            }
        }
    </script>
</body>
</html>
