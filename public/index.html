<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AA HUB 2026</title>
    <style>
        :root {
            --bg: #f4f7f6; --card-bg: #ffffff; --text: #2d3436; --border: #dfe6e9;
            --accent: #0984e3; --secondary: #636e72; --aa-bg: #ffffff;
        }
        body.dark {
            --bg: #1e272e; --card-bg: #2f3542; --text: #f1f2f6; --border: #57606f;
            --accent: #70a1ff; --secondary: #a4b0be; --aa-bg: #1e272e;
        }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; transition: 0.3s; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .card { background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; border: 1px solid var(--border); }
        .aa-content { 
            font-family: "Mona", "MS PGothic", "ＭＳ Ｐゴシック", sans-serif; font-size: 16px; line-height: 1.1; 
            white-space: pre; overflow-x: auto; background: var(--aa-bg); padding: 15px; border-radius: 8px;
            border: 1px solid var(--border); max-height: 300px; transition: 0.3s;
        }
        .aa-content.expanded { max-height: none; }
        input, textarea { width: 100%; box-sizing: border-box; background: var(--aa-bg); color: var(--text); border: 1px solid var(--border); padding: 12px; border-radius: 8px; margin-bottom: 10px; }
        .btn { border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-primary { background: var(--accent); color: white; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--secondary); font-size: 12px; }
        .tag { color: var(--accent); font-size: 13px; margin-right: 8px; cursor: pointer; }
        .badge { background: #ff4757; color: white; padding: 2px 7px; border-radius: 10px; font-size: 11px; }
        .hidden { display: none; }
    </style>
</head>
<body class="light">
    <div class="container">
        <div class="header">
            <h1>AA HUB 2026</h1>
            <div>
                <button class="btn btn-outline" onclick="toggleTheme()">🌓 モード切替</button>
                <span id="user-zone" class="hidden" style="margin-left:10px">
                    <span id="note-icon" onclick="showNotes()" style="cursor:pointer">✉️<span id="note-badge" class="badge hidden">0</span></span>
                    <span id="welcome-msg" class="user-link"></span>
                    <button class="btn btn-outline" onclick="logout()">切断</button>
                </span>
                <span id="guest-zone"><a href="/login.html" class="btn btn-primary" style="text-decoration:none">ログイン</a></span>
            </div>
        </div>

        <div class="search-bar" style="display:flex; gap:10px; margin-bottom:20px;">
            <input id="search-input" placeholder="AAを探す..." style="margin:0">
            <button onclick="loadPosts(document.getElementById('search-input').value)" class="btn btn-primary">検索</button>
        </div>

        <div id="post-form" class="card hidden">
            <input id="title" placeholder="タイトル">
            <textarea id="content" placeholder="AAを貼り付け" rows="6"></textarea>
            <input id="tags" placeholder="タグ（カンマ区切り）">
            <button onclick="postAA()" id="submit-btn" class="btn btn-primary" style="width:100%">投稿する</button>
        </div>

        <div id="post-list"></div>
    </div>

    <script>
        let currentUser = JSON.parse(localStorage.getItem('aa_user') || 'null');
        
        function toggleTheme() {
            document.body.classList.toggle('dark');
            localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light');
        }
        if(localStorage.getItem('theme') === 'dark') document.body.classList.add('dark');

        function updateUI() {
            if(currentUser) {
                document.getElementById('guest-zone').classList.add('hidden');
                document.getElementById('user-zone').classList.remove('hidden');
                document.getElementById('post-form').classList.remove('hidden');
                let welcome = `<span onclick="location.href='/profile.html?uid=${currentUser.userId}'" style="cursor:pointer">${currentUser.displayName}</span>`;
                if(currentUser.isAdmin) welcome += ` <a href="/admin.html" style="color:red">[管]</a>`;
                document.getElementById('welcome-msg').innerHTML = welcome;
                checkNotes();
            }
        }

        async function checkNotes() {
            const res = await fetch('/api/notifications/' + currentUser.userId);
            const notes = await res.json();
            if(notes.length > 0) {
                const b = document.getElementById('note-badge');
                b.innerText = notes.length; b.classList.remove('hidden');
            }
        }

        async function loadPosts(query = '') {
            const url = `/api/posts?q=${encodeURIComponent(query)}&viewerId=${currentUser?.userId || ''}`;
            const res = await fetch(url);
            const data = await res.json();
            document.getElementById('post-list').innerHTML = data.map(p => `
                <div class="card">
                    <div style="display:flex; justify-content:space-between">
                        <small class="tag" onclick="location.href='/profile.html?uid=${p.userId}'">${p.author}</small>
                        <div>
                            ${(currentUser && currentUser.isAdmin) ? `<button class="btn btn-outline" style="color:red" onclick="deletePost('${p.id}')">消去</button>` : ''}
                            ${(currentUser && currentUser.userId !== p.userId) ? `<button class="btn btn-outline" onclick="blockUser('${p.userId}')">ブロック</button>` : ''}
                        </div>
                    </div>
                    <h3 style="margin:10px 0">${p.title}</h3>
                    <div>${(p.tags || []).map(t => `<span class="tag" onclick="loadPosts('${t}')">#${t}</span>`).join('')}</div>
                    <div id="c-${p.id}" class="aa-content" style="margin-top:15px">${p.content}</div>
                    <div style="margin-top:15px; display:flex; gap:10px">
                        <button class="btn btn-outline" onclick="likePost('${p.id}', this)">❤️ <span id="l-${p.id}">${p.likes || 0}</span></button>
                        <button class="btn btn-outline" onclick="reportPost('${p.id}', '${p.userId}')">🚩</button>
                        <button class="btn btn-outline" onclick="document.getElementById('c-${p.id}').classList.toggle('expanded')">展開/縮小</button>
                    </div>
                </div>`).join('');
        }

        async function blockUser(targetId) {
            if(!confirm("このユーザーの投稿を非表示にしますか？")) return;
            await fetch('/api/user/block', {
                method: 'POST', 
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ userId: currentUser.userId, targetId })
            });
            alert("ブロックしました（再読み込みで反映）");
            location.reload();
        }

        async function postAA() {
            const btn = document.getElementById('submit-btn');
            const title = document.getElementById('title').value;
            const content = document.getElementById('content').value;
            const tags = document.getElementById('tags').value;
            if(!title || !content) return;
            btn.disabled = true;
            await fetch('/api/posts', {
                method: 'POST', 
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ title, content, tags, author: currentUser.displayName, userId: currentUser.userId })
            });
            setTimeout(() => location.reload(), 500);
        }

        async function likePost(id, btn) {
            if(!currentUser) return alert("ログインしてね");
            const res = await fetch(`/api/posts/${id}/like`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ userId: currentUser.userId }) });
            const d = await res.json();
            document.getElementById('l-'+id).innerText = d.likes;
        }

        function logout() { localStorage.removeItem('aa_user'); location.reload(); }
        updateUI(); loadPosts();
    </script>
</body>
</html>
